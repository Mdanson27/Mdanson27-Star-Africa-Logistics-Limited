<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Africa Logistics API Reference</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #071623; }
    .topbar { display: none !important; }
    .swagger-ui { color: #eaf2f8; }
    .swagger-ui .info .title, .swagger-ui .info p, .swagger-ui .opblock-tag { color: #10283a; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => SwaggerUIBundle({
      url: './openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      displayRequestDuration: true,
      persistAuthorization: false,
      docExpansion: 'none',
      filter: true,
    });
  </script>
</body>
</html>
