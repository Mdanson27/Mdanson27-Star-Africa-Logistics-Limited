# ===========================================================================
# Development mesh – rootless Podman / Docker Compose
# Generated dynamically by Copier for Bertcom Africa Business OS
# ===========================================================================

name: bertcom-africa-business-os

networks:
  platform_net:
    name: bertcom-africa-business-os_net
    driver: bridge

services:


  # ── PgBouncer Connection Pooler (Transaction Pooling Gateway) ──────────────
  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    container_name: bertcom-africa-business-os_pgbouncer
    restart: unless-stopped
    expose:
      - "6432"
    environment:
      - DB_USER=bertcom_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=bertcom_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - AUTH_TYPE=scram-sha-256
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - platform_net



  # ── Traefik reverse proxy ──────────────────────────────────────────────────
  traefik:
    image: docker.io/traefik:v3.3
    container_name: bertcom-africa-business-os_traefik
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"      # public HTTP / h2c entrypoint
      - "${DASHBOARD_PORT:-8080}:8080"     # Traefik dashboard (dev only)
    volumes:
      # Podman rootless socket — expose it read-only for label discovery
      - /run/user/${UID:-1000}/podman/podman.sock:/run/podman/podman.sock:ro
      # Static configuration file
      - ./traefik-dev.yml:/etc/traefik/traefik-dev.yml:ro
    command:
      - "--providers.file.filename=/etc/traefik/traefik-dev.yml"
      - "--providers.docker.endpoint=unix:///run/podman/podman.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=bertcom-africa-business-os_net"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    networks:
      - platform_net
    depends_on:
      - app



  # ── Cloudflare Zero Trust Tunnel ───────────────────────────────────────────
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: bertcom-africa-business-os_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:-}
    networks:
      - platform_net
    profiles:
      - production
      - edge
    
    depends_on:
      - traefik
    



  # ── Mailpit Mock SMTP Server (Development Email Inspection) ────────────────
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: bertcom-africa-business-os_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"      # SMTP ingress
      - "8025:8025"      # Web UI (http://localhost:8025)
    networks:
      - platform_net


  # ── Litestar backend ───────────────────────────────────────────────────────
  app:
    build:
      context: ../backend
      dockerfile: ../config/Containerfile
    image: localhost/bertcom-africa-business-os-app:latest
    container_name: bertcom-africa-business-os_backend
    restart: unless-stopped
    expose:
      - "8000"
    
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      
      - VALKEY_HOST=valkey-cache
      - VALKEY_PORT=6379
      
      - ENVIRONMENT=development
      - APP_BASE_URL=http://localhost:8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-ddaannson@gmail.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD is required}
      - FIRST_SUPERUSER_NAME=${FIRST_SUPERUSER_NAME:-AUTOMINDS AFRICA}
      - DOCS_UI=scalar
      - RATE_LIMIT_ENABLED=true
      
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ../backend/src:/app/src:z        # live-reload via Granian --reload
      - ../backend/tests:/app/tests:z
      - ../backend/scripts:/app/scripts:z
      - ../backend/alembic:/app/alembic:z
      - ../backend/alembic.ini:/app/alembic.ini:z
      - ../backend/pyproject.toml:/app/pyproject.toml:z
      - ../logs:/app/logs:z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres-db:
        condition: service_healthy
      
      valkey-cache:
        condition: service_started
      
    networks:
      - platform_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"


  # ── SAQ Background Worker ──────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: ../config/Containerfile
    image: localhost/bertcom-africa-business-os-worker:latest
    container_name: bertcom-africa-business-os_worker
    restart: unless-stopped
    command: ["python", "-m", "saq", "app.core.worker.settings", "--workers", "4"]
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      
      - VALKEY_HOST=valkey-cache
      - VALKEY_PORT=6379
      
      - ENVIRONMENT=development
      - APP_BASE_URL=http://localhost:8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ../backend/src:/app/src:z
      - ../backend/pyproject.toml:/app/pyproject.toml:z
      - ../logs:/app/logs:z
    depends_on:
      postgres-db:
        condition: service_healthy
      
      valkey-cache:
        condition: service_started
      
    networks:
      - platform_net



  # ── Vite frontend dev-server ───────────────────────────────────────────────
  frontend:
    image: docker.io/library/node:22-alpine
    container_name: bertcom-africa-business-os_frontend
    working_dir: /app
    volumes:
      - ../frontend:/app:z
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=
      - VITE_INITIAL_ADMIN_EMAIL=${FIRST_SUPERUSER_EMAIL:-ddaannson@gmail.com}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - platform_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"


  # ── TimescaleDB + pgvector ─────────────────────────────────────────────────
  postgres-db:
    
    image: docker.io/timescale/timescaledb-ha:pg16
    
    container_name: bertcom-africa-business-os_postgres
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=bertcom_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=bertcom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"    # direct access for migrations & psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U bertcom_user -d bertcom_db || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform_net


  # ── Valkey ────────────────────────────────────────────────────────────────
  valkey-cache:
    image: docker.io/valkey/valkey:8-alpine
    container_name: bertcom-africa-business-os_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data:Z
    networks:
      - platform_net


volumes:
  postgres_data:
    name: bertcom-africa-business-os_postgres_data

  valkey_data:
    name: bertcom-africa-business-os_valkey_data


  frontend_node_modules:
    name: bertcom-africa-business-os_frontend_node_modules

