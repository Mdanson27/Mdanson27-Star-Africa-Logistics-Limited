name: Deploy Star Africa Logistics frontend to GitHub Pages

# Keep deployment manual until Star Africa Neon/Auth and branding are configured.
# After Phase 1 setup is complete, the technical team may add a push-to-main trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Mdanson27-Star-Africa-Logistics-Limited/
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
          VITE_PLATFORM_ADMIN_EMAIL: ${{ secrets.VITE_PLATFORM_ADMIN_EMAIL }}
          # The API host is intentionally runtime-only. Never compile a
          # Cloudflare Quick Tunnel hostname into the production bundle.
          VITE_API_URL: ""
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
